  <!-- Plan B de los QR impresos. Si _redirects falla, se borra o el hosting no lo lee, las rutas cortas
       llegan aquí y este script las manda a su destino. Debe coincidir con _redirects:
       tools/verificar-qr.mjs lo comprueba. No depende de ningún otro archivo a propósito. -->
  <script id="qr-rutas" type="application/json">
    {
      "/carta": "/productos.html",
      "/reservar": "/reservas.html",
      "/vip": "/reservas.html?servicio=vip",
      "/hookah": "/reservas.html?servicio=hookah",
      "/cumple": "/reservas.html?servicio=combo&ocasion=Cumplea%C3%B1os",
      "/resena": "/ir-resena.html",
      "/m/:mesa": "/productos.html?mesa=:mesa"
    }
  </script>
  <script>
    (function () {
      try {
        var rutas = JSON.parse(document.getElementById("qr-rutas").textContent);
        // Tolera mayúsculas, "/" al final y ".html": /CARTA/, /m/VIP1/ y /carta.html sirven igual.
        var p = decodeURIComponent(location.pathname).toLowerCase().replace(/\.html$/, "").replace(/\/+$/, "") || "/";
        var m = p.match(/^\/m\/([a-z0-9-]+)$/);
        var destino = m ? rutas["/m/:mesa"].replace(":mesa", m[1]) : rutas[p];
        if (destino) location.replace(destino);
      } catch (e) {}
    })();
  </script>
